# Plain, kubectl-appliable Service. Adapted into chart/templates by setting
# metadata.namespace to {{ .Release.Namespace }}; everything else is unchanged.
apiVersion: v1
kind: Service
metadata:
  name: sample-poc
  labels:
    app: sample-poc
spec:
  type: ClusterIP
  selector:
    app: sample-poc
  ports:
    - name: http
      port: 80
      targetPort: http
