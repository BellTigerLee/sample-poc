{{- if and .Values.karmada.enabled .Values.karmada.avoidNodes }}
{{- /*
Keep sample-poc pods off specific member-cluster nodes. This is a per-fleet
placement fact (which node in which member), so the node list comes from values
(karmada.avoidNodes), not from any pod template. The OverridePolicy injects a
required nodeAffinity on the targeted cluster's copy only; the base Deployments
carry no cluster-specific affinity.

resourceSelectors reference each workload by name (the render-contract validator
resolves selectors by name, not labelSelector). A rule that targets a cluster a
workload never reaches is a no-op, so naming the b-only store here is harmless.
*/}}
apiVersion: policy.karmada.io/v1alpha1
kind: OverridePolicy
metadata:
  name: {{ include "sample-poc.fullname" . }}-avoid-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-poc.labels" . | nindent 4 }}
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: {{ include "sample-poc.fullname" . }}-metrics-collector
      namespace: {{ .Release.Namespace }}
    - apiVersion: apps/v1
      kind: Deployment
      name: {{ include "sample-poc.fullname" . }}-stats-analyzer
      namespace: {{ .Release.Namespace }}
    - apiVersion: apps/v1
      kind: Deployment
      name: {{ include "sample-poc.fullname" . }}-ring-store
      namespace: {{ .Release.Namespace }}
  overrideRules:
    {{- range .Values.karmada.avoidNodes }}
    - targetCluster:
        clusterNames:
          - {{ .cluster | quote }}
      overriders:
        plaintext:
          - path: /spec/template/spec/affinity
            operator: add
            value:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: NotIn
                          values:
                            {{- range .hostnames }}
                            - {{ . | quote }}
                            {{- end }}
    {{- end }}
{{- end }}
