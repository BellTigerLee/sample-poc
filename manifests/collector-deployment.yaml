apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-poc-metrics-collector
  labels:
    app.kubernetes.io/name: sample-poc
    app.kubernetes.io/component: metrics-collector
    scalex.io/role: child
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-poc
      app.kubernetes.io/component: metrics-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-poc
        app.kubernetes.io/component: metrics-collector
        scalex.io/role: child
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metrics-collector
          image: 10.34.25.18/tower-ci/sample-poc/metrics-collector:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STORE_URL
              value: http://10.33.142.20
            - name: COLLECT_INTERVAL
              value: "5"
            - name: SITE_NAME
              value: unknown
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
