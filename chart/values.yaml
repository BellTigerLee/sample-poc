nameOverride: ""
fullnameOverride: ""

# Image inventory. Keys must match images/<name>/Dockerfile.
# repository/tag are child-owned; digest/sourceRevision are injected by the
# Federation promotion (releases/<child>/values.yaml).
images:
  metrics-collector:
    repository: 10.34.25.18/tower-ci/sample-poc/metrics-collector
    tag: v0.2.2
    pullPolicy: IfNotPresent
  stats-analyzer:
    repository: 10.34.25.18/tower-ci/sample-poc/stats-analyzer
    tag: v0.2.2
    pullPolicy: IfNotPresent
  ring-store:
    repository: 10.34.25.18/tower-ci/sample-poc/ring-store
    tag: v0.2.2
    pullPolicy: IfNotPresent

collector:
  replicas: 1
  port: 8080
  intervalSeconds: 5
  bufferSize: 50
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

analyzer:
  replicas: 1
  port: 8080
  intervalSeconds: 10
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

store:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  service:
    type: LoadBalancer
    loadBalancerIP: 10.33.142.20
    port: 80
    targetPort: 8080

karmada:
  enabled: true
  placement:
    analyzer:
      clusterNames:
        - c
    store:
      clusterNames:
        - b
  # Keep pods off specific member-cluster nodes. Empty by default (renders no
  # OverridePolicy); the Federation runtime-values.yaml supplies the per-fleet
  # node list, since which node in which member is a fleet fact, not a child
  # default. Each entry: {cluster: <member>, hostnames: [<kubernetes.io/hostname>, ...]}.
  avoidNodes:
    - cluster: c
      hostnames:
        - d4dc6606-bfde-11d3-8000-4cbb472a16ef
