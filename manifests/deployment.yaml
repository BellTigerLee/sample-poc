# Plain, kubectl-appliable Deployment. This is the authoring source of truth.
# When adapted into chart/templates, only two things change:
#   - metadata.namespace becomes {{ .Release.Namespace }}
#   - the built image ref becomes {{ .Values.images.app... }} (digest injected by Federation)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-poc
  labels:
    app: sample-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-poc
  template:
    metadata:
      labels:
        app: sample-poc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: 10.34.25.18/tower-ci/sample-poc/app:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
