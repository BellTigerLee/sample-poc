apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-poc-ring-store
  labels:
    app.kubernetes.io/name: sample-poc
    app.kubernetes.io/component: ring-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-poc
      app.kubernetes.io/component: ring-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-poc
        app.kubernetes.io/component: ring-store
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ring-store
          image: 10.34.25.18/tower-ci/sample-poc/ring-store:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BUFFER_SIZE
              value: "50"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
